# THROWAWAY test Blueprint — for bisecting Render's per-service route cap.
#
# Standalone so it can't touch prod: distinct name, NO custom domains, points at
# the fork, and uses a trivial dummy build so each sync is near-instant (we're
# testing route application, not the real site build).
#
# Procedure: raise MAX in scripts/sync-render-redirects.mjs, run
# `npm run sync-redirects`, commit, push, and Manual Sync the test Blueprint.
# Repeat until a sync fails on "Update web service routes" — that's the ceiling.
#
# Routing note: generated redirects sit ABOVE the SPA-fallback rewrites so they
# win under Render's first-match-by-priority routing.
version: "1"
services:
  - type: web
    name: docs-route-test
    runtime: static
    repo: https://github.com/a-thomas-22/docs
    buildCommand: mkdir -p docs/dist && printf '<!doctype html><title>route test</title>ok' > docs/dist/index.html
    staticPublishPath: ./docs/dist
    autoDeployTrigger: commit
    routes:
      # >>> BEGIN GENERATED REDIRECTS — produced by `npm run sync-redirects`; do not edit by hand
