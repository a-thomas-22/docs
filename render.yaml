# THROWAWAY test Blueprint — for bisecting Render's per-service route cap.
#
# Standalone so it can't touch prod: distinct name, NO custom domains, points at
# the fork, and uses a trivial dummy build so each sync is near-instant (we're
# testing route application, not the real site build).
#
# Procedure: raise MAX in scripts/sync-render-redirects.mjs, run
# `npm run sync-redirects`, commit, push, and Manual Sync the test Blueprint.
# Repeat until a sync fails on "Update web service routes" — that's the ceiling.
#
# Routing note: generated redirects sit ABOVE the SPA-fallback rewrites so they
# win under Render's first-match-by-priority routing.
version: "1"
services:
  - type: web
    name: docs-route-test
    runtime: static
    repo: https://github.com/a-thomas-22/docs
    buildCommand: mkdir -p docs/dist && printf '<!doctype html><title>route test</title>ok' > docs/dist/index.html
    staticPublishPath: ./docs/dist
    autoDeployTrigger: commit
    routes:
      # >>> BEGIN GENERATED REDIRECTS — produced by `npm run sync-redirects`; do not edit by hand
      - type: redirect
        source: "/smart-accounts/account-recovery/flow-intro"
        destination: "/advanced/account-recovery/flow-intro"
      - type: redirect
        source: "/smart-accounts/account-recovery/flow-setup"
        destination: "/advanced/account-recovery/flow-setup"
      - type: redirect
        source: "/smart-accounts/account-recovery/portal"
        destination: "/advanced/account-recovery/portal"
      - type: redirect
        source: "/smart-accounts/eip-7702/quickstart"
        destination: "/get-started/eip-7702/quickstart"
      - type: redirect
        source: "/cross-chain/smart-routing-address"
        destination: "/onramp/smart-routing-address"
      - type: redirect
        source: "/cross-chain/chain-abstraction/overview"
        destination: "/smart-accounts/chain-abstraction/overview"
      - type: redirect
        source: "/cross-chain/chain-abstraction/supported-base-tokens"
        destination: "/smart-accounts/chain-abstraction/supported-base-tokens"
      - type: redirect
        source: "/cross-chain/chain-abstraction/supported-defi-tokens"
        destination: "/smart-accounts/chain-abstraction/supported-defi-tokens"
      - type: redirect
        source: "/advanced/defi"
        destination: "/smart-accounts/defi"
      - type: redirect
        source: "/advanced/multi-chain-signing"
        destination: "/smart-accounts/multi-chain-signing"
      - type: redirect
        source: "/advanced/parallel-transactions"
        destination: "/smart-accounts/parallel-transactions"
      - type: redirect
        source: "/advanced/deploy-contract"
        destination: "/smart-accounts/deploy-contract"
      - type: redirect
        source: "/advanced/delegatecall"
        destination: "/smart-accounts/delegatecall"
      - type: redirect
        source: "/resources/infrastructure/intro"
        destination: "/api-and-toolings/infrastructure/intro"
      - type: redirect
        source: "/resources/infrastructure/gas-policies"
        destination: "/api-and-toolings/infrastructure/gas-policies"
      - type: redirect
        source: "/resources/infrastructure/custom-gas-policies"
        destination: "/api-and-toolings/infrastructure/custom-gas-policies"
      # <<< END GENERATED REDIRECTS
      # ---- fixed hand-maintained tail: the legacy routes not in redirects.config.js ----
      # Keep BELOW the generated redirects (first match wins).
      - type: redirect
        source: "/magic-account/*"
        destination: "/smart-accounts/chain-abstraction/overview"
      - type: rewrite
        source: "/sdk/*"
        destination: "/index.html"
      - type: rewrite
        source: "/sdk"
        destination: "/index.html"
      - type: rewrite
        source: "/meta-infra/*"
        destination: "/index.html"
      - type: rewrite
        source: "/meta-infra"
        destination: "/index.html"
      - type: rewrite
        source: "/recovery-flow/*"
        destination: "/index.html"
      - type: rewrite
        source: "/recovery-flow"
        destination: "/index.html"
      - type: rewrite
        source: "/blog/*"
        destination: "/index.html"
      - type: rewrite
        source: "/blog"
        destination: "/index.html"
      - type: rewrite
        source: "/react/*"
        destination: "/index.html"
      - type: rewrite
        source: "/react"
        destination: "/index.html"
      - type: rewrite
        source: "/smart-wallet/*"
        destination: "/index.html"
      - type: rewrite
        source: "/smart-wallet"
        destination: "/index.html"
